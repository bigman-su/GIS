<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIS 국제학교 배식 안내</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #f4f4f4;
        }

        /* 컴퓨터 화면 */
        .desktop-view {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 휴대폰 화면에서는 버튼 표시 */
        .mobile-view {
            display: none;
        }

        @media (max-width: 768px) {
            html, body {
                height: auto;
                min-height: 100%;
                overflow: auto;
            }

            .desktop-view {
                display: none;
            }

            .mobile-view {
                display: flex;
                min-height: 100vh;
                padding: 30px 20px;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
            }

            .mobile-view h1 {
                font-size: 23px;
                color: #222;
                margin-bottom: 12px;
            }

            .mobile-view p {
                font-size: 15px;
                line-height: 1.7;
                color: #555;
                margin-bottom: 24px;
            }

            .pdf-button {
                display: inline-block;
                padding: 15px 24px;
                border-radius: 10px;
                background: #174a88;
                color: white;
                text-decoration: none;
                font-size: 17px;
                font-weight: bold;
            }

            .help-text {
                margin-top: 18px;
                font-size: 13px;
                color: #777;
            }
        }
    </style>
</head>

<body>

    <!-- 컴퓨터에서는 기존 PDF 화면 유지 -->
    <iframe
        class="desktop-view"
        src="GIS.pdf"
        title="GIS 국제학교 배식 안내">
    </iframe>

    <!-- 휴대폰에서는 PDF 직접 열기 버튼 표시 -->
    <main class="mobile-view">
        <h1>GIS 국제학교 배식 안내</h1>

        <p>
            배식 안내문 전체 4페이지를 확인하시려면<br>
            아래 버튼을 눌러주세요.
        </p>

        <a
            class="pdf-button"
            href="GIS.pdf"
            target="_blank"
            rel="noopener noreferrer">
            📄 PDF 전체 페이지 보기
        </a>

        <div class="help-text">
            PDF가 열리면 화면을 넘겨 나머지 페이지도 확인할 수 있습니다.
        </div>
    </main>

</body>
</html>
